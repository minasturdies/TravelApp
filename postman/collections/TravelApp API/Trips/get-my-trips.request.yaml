$kind: http-request
name: 'Get My Trips'
order: 2000
method: GET
url: '{{baseUrl}}/api/trips'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });

      pm.test("Each trip has required fields", function () {
          const trips = pm.response.json();
          if (trips.length > 0) {
              const t = trips[0];
              pm.expect(t).to.have.property("id");
              pm.expect(t).to.have.property("startDate");
              pm.expect(t).to.have.property("endDate");
          }
      });
