spring:
  application:
    name: travel-app-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/travelapp
    username: postgres
    password: 11046999
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' because Flyway owns the schema, not Hibernate.
      # Never use 'update' or 'create' once Flyway is in place.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8091

app:
  jwt:
    # In production this MUST come from an environment variable, never hardcoded.
    secret: s5d5f6f25e8e9rr5ff2i7u4uj1n2bn2bv3ft6t1
    expiration-ms: 86400000 # 24h

  foursquare:
    api-key: 302WMRMVSYTDQJQ2K1NOPFIXLE2NXPXMYMRSZQCLFVOSPDZD
    base-url: https://places-api.foursquare.com/places
